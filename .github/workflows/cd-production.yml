name: CD - Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # google-github-actions/auth@v2 用 Workload Identity Federation 換取短期憑證，
      # 需要這個 job 能簽發 OIDC token 才能跟 GCP 交換身分——這個權限預設不會給，
      # 一定要在這裡明確宣告，不然 auth 這步會直接失敗。
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/tradebeyond-api-prod/tradebeyond-images/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/556983952174/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@tradebeyond-api-prod.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradebeyond-api \
            --project=tradebeyond-api-prod \
            --image="$IMAGE" \
            --region=us-central1 \
            --platform=managed \
            --service-account=tradebeyond-backend-runtime@tradebeyond-api-prod.iam.gserviceaccount.com \
            --add-cloudsql-instances=tradebeyond-api-prod:us-central1:tradebeyond-db-instance \
            --set-env-vars="DB_URL=jdbc:postgresql:///tradebeyond?cloudSqlInstance=tradebeyond-api-prod:us-central1:tradebeyond-db-instance&socketFactory=com.google.cloud.sql.postgres.SocketFactory,DB_USERNAME=tradebeyond_prod_user" \
            --set-secrets="DB_PASSWORD=db-prod-password:latest,JWT_SECRET=app-jwt-secret:latest" \
            --port=8080 --memory=512Mi --cpu=1 \
            --min-instances=1 --max-instances=1 --no-cpu-throttling \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test /actuator/health on the Cloud Run URL
        run: |
          # Cloud Run 回報部署完成，跟 Spring Boot app 真正啟動完畢（連上 Cloud SQL、
          # 跑完 Flyway、組完 Security bean）之間有幾秒到十幾秒的空窗，直接打一次
          # 不通過就判失敗太急躁——改成重試：最多 10 次、每次間隔 5 秒（最多等 50 秒）。
          #
          # 目標網址故意不打自訂網域 test.tbpurity.com：那個網域經過 Cloudflare，
          # Cloudflare 的機器人防護會把 curl 這種非瀏覽器的自動化請求判定成可疑流量，
          # 回一個 JS 挑戰頁（"Just a moment..."）——curl 永遠沒辦法通過這種挑戰，
          # 不管重試幾次都一樣會失敗，這不是重試次數或間隔能解決的，是打錯了目標。
          # 這裡的 smoke test 目的是驗證「這次部署的程式碼本身有沒有成功啟動」，
          # 不是驗證 Cloudflare 的邊界設定，所以刻意繞開 Cloudflare，直接打 Cloud Run
          # 配發的原始網址（*.run.app，不經過任何代理），避免碰到機器人防護的挑戰頁。
          url="https://tradebeyond-api-556983952174.us-central1.run.app/actuator/health"
          max_attempts=10
          interval_seconds=5
          status="000"

          for attempt in $(seq 1 "$max_attempts"); do
            # 不用 curl -f：-f 遇到非 2xx 會直接讓 curl 回傳錯誤、連狀態碼本身都拿不到，
            # 不利於印出診斷資訊；用 -w "%{http_code}" 純數字狀態碼自己判斷。
            # || echo "000"：curl 本身連線失敗（DNS、連線被拒等）時不要讓 set -e 直接
            # 中止整個 step，一樣要進到重試迴圈，而不是第一次就整個 fail 掉。
            status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")

            if [ "$status" = "200" ]; then
              echo "健康檢查成功（第 $attempt/$max_attempts 次嘗試，狀態碼 200）"
              exit 0
            fi

            echo "第 $attempt/$max_attempts 次嘗試：狀態碼 $status，還不是 200"

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep "$interval_seconds"
            fi
          done

          echo "健康檢查在 $max_attempts 次嘗試內都沒有拿到 200，判定部署失敗" >&2
          echo "最後一次狀態碼：$status" >&2
          echo "最後一次 response body：" >&2
          curl -s "$url" >&2 || echo "（擷取 response body 時發生連線錯誤）" >&2
          exit 1
