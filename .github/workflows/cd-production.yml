name: CD - Production

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # google-github-actions/auth@v2 用 Workload Identity Federation 換取短期憑證，
      # 需要這個 job 能簽發 OIDC token 才能跟 GCP 交換身分——這個權限預設不會給，
      # 一定要在這裡明確宣告，不然 auth 這步會直接失敗。
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/tradebeyond-api-prod/tradebeyond-images/backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/556983952174/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@tradebeyond-api-prod.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t "$IMAGE" .

      - name: Push Docker image
        run: docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy tradebeyond-api \
            --project=tradebeyond-api-prod \
            --image="$IMAGE" \
            --region=us-central1 \
            --platform=managed \
            --service-account=tradebeyond-backend-runtime@tradebeyond-api-prod.iam.gserviceaccount.com \
            --add-cloudsql-instances=tradebeyond-api-prod:us-central1:tradebeyond-db-instance \
            --set-env-vars="DB_URL=jdbc:postgresql:///tradebeyond?cloudSqlInstance=tradebeyond-api-prod:us-central1:tradebeyond-db-instance&socketFactory=com.google.cloud.sql.postgres.SocketFactory,DB_USERNAME=tradebeyond_prod_user" \
            --set-secrets="DB_PASSWORD=db-prod-password:latest,JWT_SECRET=app-jwt-secret:latest" \
            --port=8080 --memory=512Mi --cpu=1 \
            --min-instances=1 --max-instances=1 --no-cpu-throttling \
            --allow-unauthenticated \
            --quiet

      - name: Smoke test /actuator/health on the custom domain
        run: |
          response=$(curl -sf https://test.tbpurity.com/actuator/health)
          echo "回應內容：$response"
          if [ "$response" != '{"status":"UP"}' ]; then
            echo "健康檢查回應內容不符預期，部署後端點異常" >&2
            exit 1
          fi
